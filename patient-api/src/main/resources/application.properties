spring.application.name=patient-api
server.port=8081

# Supabase (실제 값은 .env 또는 환경변수로 주입)
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# CORS — 프론트엔드 dev origin 허용
clarix.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
