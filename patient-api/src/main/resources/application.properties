spring.application.name=patient-api
server.port=${PORT:8081}

# ============================================================
# 기본 DB: MySQL 8.x
# 실행 전 DB 생성:
#   CREATE DATABASE clarix CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# ============================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:clarix}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
# open-in-view=true (Spring Boot 기본값 유지) — Thymeleaf가 렌더 중 lazy 관계 접근 가능.
# 학습용 프로젝트라 단순성 우선. 실서비스에선 Service 계층에서 fetch join 권장.
spring.sql.init.mode=never

# Thymeleaf (개발 중엔 캐시 끔)
spring.thymeleaf.cache=false

# 정적 자원
spring.web.resources.static-locations=classpath:/static/

# ============================================================
# Spring Security 세션 인증. 미인증이면 /auth/login 리다이렉트.
# ============================================================
server.servlet.session.timeout=24h

# ============================================================
# Gemini API (LLM SOAP autofill)
# - 환경변수 GEMINI_API_KEY로 설정. 빈 값이면 endpoint가 503 반환.
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.0-flash
