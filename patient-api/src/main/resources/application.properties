spring.application.name=patient-api
server.port=${PORT:8081}

# ============================================================
# 기본 프로필: H2 in-memory
# 평가자 PC에서 외부 의존성 없이 즉시 실행. http://localhost:8081/h2-console로 접속.
# ============================================================
spring.datasource.url=jdbc:h2:mem:clarix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# open-in-view=true (Spring Boot 기본값 유지) — Thymeleaf가 렌더 중 lazy 관계 접근 가능.
# 학습용 프로젝트라 단순성 우선. 실서비스에선 Service 계층에서 fetch join 권장.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf (개발 중엔 캐시 끔)
spring.thymeleaf.cache=false

# 정적 자원
spring.web.resources.static-locations=classpath:/static/

# ============================================================
# 평가용 임시 인증 - 12주차 Spring Security 배운 후 교체.
# 가입 시 user_id를 세션에 저장. 미인증이면 /auth/login 리다이렉트.
# ============================================================
server.servlet.session.timeout=24h

# ============================================================
# Gemini API (LLM SOAP autofill)
# - 환경변수 GEMINI_API_KEY로 설정. 빈 값이면 endpoint가 503 반환.
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.0-flash
