<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 시작하기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
  <style>
    .step-pills { display:flex; gap:6px; margin-bottom: 16px; }
    .step-pill { flex:1; height:4px; background: rgba(4,19,48,0.12); border-radius:2px; }
    .step-pill[data-active="true"] { background: var(--clarix-coral); }

    .tab-row { display:flex; gap:6px; margin-bottom: 14px; }
    .tab-row a {
      flex: 1; height: 38px; line-height: 38px; text-align: center;
      background: #fff; border: 1px solid var(--clarix-line);
      border-radius: 12px; color: var(--clarix-coral-dim);
      font-weight: 600; font-size: 13px;
      text-decoration: none;
    }
    .tab-row a.active {
      background: var(--clarix-coral);
      color: #fff;
      border-color: var(--clarix-coral);
      box-shadow: 0 4px 10px rgba(200,84,63,0.22);
    }

    .hospital-card {
      background: #fff; border-radius: 14px;
      padding: 14px 16px; margin-bottom: 8px;
      border: 1px solid transparent;
      box-shadow: 0 2px 8px rgba(4,19,48,0.04);
    }
    .hospital-card .name { font-weight: 700; color: var(--clarix-navy); }
    .hospital-card .meta { color: var(--clarix-coral-dim); font-size: 12px; margin-top: 4px; }
    .hospital-card .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
      background: rgba(4,19,48,0.06); color: var(--clarix-navy);
      margin-right: 6px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .hospital-card .badge[data-tone="ok"] {
      background: var(--clarix-coral); color: #fff;
    }
    .hospital-card form { margin-top: 10px; }
    .hospital-card button {
      background: transparent; border: 1px solid var(--clarix-coral);
      color: var(--clarix-coral); padding: 6px 14px;
      border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px;
      transition: background 120ms, color 120ms;
    }
    .hospital-card button:hover { background: var(--clarix-coral); color: #fff; }
  </style>
</head>
<body class="patient clarix">
  <div class="patient-shell">
    <div class="step-pills">
      <div class="step-pill" data-active="true"></div>
      <div class="step-pill"></div>
      <div class="step-pill"></div>
    </div>
    <div class="patient-greeting">단계 1/3</div>
    <h1 class="patient-headline">병원을 연결해주세요</h1>
    <p style="color: var(--clarix-coral-dim); font-size: 14px; margin: 0 0 16px; line-height:1.5;">
      진료를 받을 병원을 선택하면 의료진이 내 기록을 함께 볼 수 있어요.
    </p>

    <div class="tab-row">
      <a th:href="@{/patient/welcome(tab='partnered')}" th:classappend="${activeTab == 'partnered'} ? 'active'">내 병원 (연동)</a>
      <a th:href="@{/patient/welcome(tab='nearby')}"    th:classappend="${activeTab == 'nearby'} ? 'active'">내 주위 병원</a>
    </div>

    <div th:if="${#lists.isEmpty(hospitals)}"
         style="text-align:center; padding:32px 16px; color: var(--clarix-coral-dim); font-size:13px;">
      표시할 병원이 없습니다.
    </div>

    <div th:each="h : ${hospitals}" class="hospital-card">
      <div class="name" th:text="${h.name}"></div>
      <div class="meta">
        <span th:if="${h.partnered}"  class="badge" data-tone="ok">연동</span>
        <span th:unless="${h.partnered}" class="badge">미연동</span>
        <span th:text="${h.specialty}"></span>
        · <span th:text="${h.distanceKm}">0</span>km
        · <span th:text="${h.address}"></span>
      </div>
      <form th:if="${h.partnered}" th:action="@{/patient/welcome}" method="post">
        <input type="hidden" name="hospitalId" th:value="${h.id}" />
        <button type="submit">이 병원 선택</button>
      </form>
    </div>

    <div style="margin-top: 24px; text-align:center;">
      <form th:action="@{/patient/welcome/skip}" method="post">
        <button type="submit" class="btn-clarix btn-clarix-ghost"
                style="display:inline-flex; padding: 0 20px; height: 44px;">나중에 (건너뛰기)</button>
      </form>
    </div>
  </div>
</body>
</html>
