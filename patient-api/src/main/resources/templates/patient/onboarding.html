<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 약 등록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
  <style>
    .step-pills { display:flex; gap:6px; margin-bottom: 16px; }
    .step-pill { flex:1; height:4px; background: rgba(4,19,48,0.12); border-radius:2px; }
    .step-pill[data-active="true"] { background: var(--clarix-coral); }

    .med-row {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(4,19,48,0.05);
    }
    .med-row input[type="text"] {
      width: 100%; height: 42px; padding: 0 14px;
      border: 1px solid var(--clarix-line);
      border-radius: 10px; font-size: 15px;
      margin-bottom: 12px;
      background: #fff; color: var(--clarix-navy);
      transition: border-color 120ms;
    }
    .med-row input[type="text"]:focus {
      outline: none; border-color: var(--clarix-coral);
      box-shadow: 0 0 0 3px rgba(233,127,102,0.18);
    }

    .slot-toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .slot-toggles label {
      height: 38px; line-height: 38px; text-align: center;
      border: 1px solid var(--clarix-line);
      border-radius: 10px;
      background: #fff;
      color: var(--clarix-coral-dim);
      font-weight: 600; font-size: 13px;
      cursor: pointer;
      transition: all 120ms;
    }
    .slot-toggles input { display: none; }
    .slot-toggles input:checked + label {
      background: var(--clarix-coral);
      color: #fff;
      border-color: var(--clarix-coral);
      box-shadow: 0 3px 8px rgba(200,84,63,0.22);
    }

    .days-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--clarix-navy);
    }
    .days-row input {
      width: 84px; height: 36px; padding: 0 12px;
      border: 1px solid var(--clarix-line);
      border-radius: 10px; font-size: 14px; text-align: right;
      color: var(--clarix-navy); background: #fff;
    }
    .days-row input:focus { outline: none; border-color: var(--clarix-coral); }
    .days-row .hint { font-size: 11px; color: var(--clarix-coral-dim); margin-left: auto; }

    .existing-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--clarix-bg-soft);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .existing-row .info { font-weight: 600; color: var(--clarix-navy); }
    .existing-row .schedule { color: var(--clarix-coral-dim); font-size: 12px; margin-top: 2px; }
    .existing-row .schedule .tag {
      display: inline-block;
      background: rgba(4,19,48,0.06);
      padding: 1px 8px;
      border-radius: 999px;
      margin-right: 4px;
      font-size: 11px;
    }
    .existing-row form { display: inline; }
    .existing-row button {
      background: transparent; border: 0;
      color: var(--clarix-coral-dim);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
    }

    .section-title-clarix {
      font-size: 12px; font-weight: 700;
      color: var(--clarix-coral-dim);
      letter-spacing: 0.04em;
      margin: 20px 4px 8px;
    }

    /* Modal Dialog styles */
    .med-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(4, 19, 48, 0.42);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 500;
      padding: 20px;
      transition: opacity 200ms ease;
    }
    .med-modal-content {
      background: #FFFFFF;
      border-radius: 24px;
      width: 100%; max-width: 380px;
      padding: 22px;
      box-shadow: 0 12px 36px rgba(4, 19, 48, 0.16);
      display: flex; flex-direction: column;
      animation: scale-up 240ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scale-up {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .med-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .med-modal-header h3 {
      margin: 0; font-size: 18px; font-weight: 800; color: var(--clarix-navy);
    }
    .med-modal-header .close-btn {
      background: transparent; border: 0;
      font-size: 24px; color: var(--clarix-coral-dim);
      cursor: pointer; line-height: 1; padding: 4px;
    }
    .med-modal-body {
      display: flex; flex-direction: column;
    }

    /* Added meds item rows style */
    .added-med-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(4,19,48,0.04);
      border: 1px solid var(--clarix-line);
      text-align: left;
    }
    .added-med-item .info-side {
      display: flex; flex-direction: column; gap: 2px;
    }
    .added-med-item .med-title {
      font-weight: 700; color: var(--clarix-navy); font-size: 14px;
    }
    .added-med-item .med-tags {
      display: flex; gap: 4px; font-size: 11px; font-weight: 600; color: var(--clarix-coral-dim);
      flex-wrap: wrap;
    }
    .added-med-item .delete-btn {
      background: transparent; border: 0;
      color: #FF453A; font-weight: 700; font-size: 12px;
      cursor: pointer; padding: 6px;
    }
  </style>
</head>
<body class="patient clarix">
  <div class="patient-shell">
    <div th:if="${isOnboarding}" class="step-pills">
      <div class="step-pill" data-active="true"></div>
      <div class="step-pill" data-active="true"></div>
      <div class="step-pill" data-active="true"></div>
    </div>
    <div class="patient-greeting" th:if="${isOnboarding}">단계 3/3</div>
    <th:block th:unless="${isOnboarding}">
      <a class="clarix-back" th:href="@{/patient/me}" aria-label="뒤로 가기">‹</a>
    </th:block>

    <h1 class="patient-headline" th:text="${isOnboarding} ? '복용 중인 약을 등록해주세요' : '내 약 관리'">내 약 관리</h1>
    <p style="color: var(--clarix-coral-dim); font-size: 14px; margin-top: 4px; line-height:1.5;">
      복용 중인 약과 시간대를 등록해주세요.<br/>매일 봉투를 찢어 복약을 기록할 수 있어요.
    </p>

    <div class="section-title-clarix">활성 처방</div>
    <div th:if="${#lists.isEmpty(existing)}"
         style="color: rgba(4,19,48,0.4); font-size: 13px; padding: 8px 4px;">
      등록된 약이 없습니다.
    </div>
    <div th:each="p : ${existing}" class="existing-row" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <div>
          <div class="info" th:text="${p.medicationName}"></div>
          <div class="schedule">
            <th:block th:each="s : ${p.scheduleSlots()}">
              <span class="tag" th:text="${s == 'morning'} ? '아침' : (${s == 'noon'} ? '점심' : '저녁')"></span>
            </th:block>
            <span style="margin-left:4px;" th:text="${p.daysSupply} + '일분'">—</span>
          </div>
        </div>
        <form th:action="@{'/patient/onboarding/deactivate/' + ${p.id}}" method="post"
              onsubmit="return confirm('이 약 처방을 중단할까요? 과거 기록은 유지됩니다.');">
          <button type="submit">중단</button>
        </form>
      </div>
      <form th:action="@{'/patient/onboarding/storage/' + ${p.id}}" method="post"
            style="display:flex; gap:6px; margin-top:8px;">
        <input type="text" name="storage" th:value="${p.storageLocation}"
               placeholder="📍 보관 위치"
               style="flex:1; height:32px; padding:0 10px; border:1px solid var(--clarix-line); border-radius:6px; font-size:12px;" />
        <button type="submit" class="btn-clarix btn-clarix-ghost"
                style="height:32px; padding:0 12px; font-size:12px;">저장</button>
      </form>
    </div>

    <div class="section-title-clarix">새 약 추가 (최대 5개)</div>
    
    <!-- Added Meds List -->
    <div id="added-meds-list" style="margin-bottom: 12px;">
      <div style="color: rgba(4,19,48,0.4); font-size: 13px; padding: 16px 12px; text-align: center; background: rgba(255,255,255,0.4); border-radius:12px; border:1px dashed var(--clarix-line);" id="meds-empty-notice">
        추가된 새 약이 없습니다. 아래 버튼을 눌러 추가해주세요.
      </div>
    </div>

    <!-- Trigger Button -->
    <button type="button" class="btn-clarix btn-clarix-ghost" id="open-add-dialog-btn" style="width:100%; border-style:dashed; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <span>+ 새 약 추가하기</span>
    </button>

    <form th:action="@{/patient/onboarding}" method="post" id="onboardingMedForm">
      <!-- Hidden inputs for backend DTO mapping -->
      <div id="hidden-inputs-container">
        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
          <input type="hidden" th:id="'raw-name-' + ${i}" th:name="'name' + ${i}" value="" />
          <input type="hidden" th:id="'raw-days-' + ${i}" th:name="'days' + ${i}" value="" />
          <input type="hidden" th:id="'raw-storage-' + ${i}" th:name="'storage' + ${i}" value="" />
          <div th:id="'raw-slots-container-' + ${i}"></div>
        </th:block>
      </div>

      <div style="margin-top: 24px; display: flex; gap: 8px;">
        <a th:href="@{/patient/}" class="btn-clarix btn-clarix-ghost"
           style="flex:1;"
           th:text="${isOnboarding} ? '건너뛰기' : '취소'">취소</a>
        <button type="submit" class="btn-clarix btn-clarix-primary" style="flex:2;">저장</button>
      </div>
    </form>

  <!-- Modal Dialog -->
  <div class="med-modal-backdrop" id="med-modal" style="display:none;">
    <div class="med-modal-content">
      <div class="med-modal-header">
        <h3>새 약 추가</h3>
        <button type="button" class="close-btn" id="close-modal-btn">&times;</button>
      </div>
      <div class="med-modal-body">
        <div class="field" style="margin-bottom:14px; display:flex; flex-direction:column; text-align:left;">
          <label style="font-weight:700; color:var(--clarix-navy); font-size:13px; margin-bottom:6px; display:block;">약 이름</label>
          <input type="text" id="dlg-med-name" placeholder="약 이름 입력 (예: 콘서타 18mg)" style="width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--clarix-line); border-radius: 10px; font-size: 14px; background:#fff; color:var(--clarix-navy);" />
        </div>
        <div class="field" style="margin-bottom:14px; display:flex; flex-direction:column; text-align:left;">
          <label style="font-weight:700; color:var(--clarix-navy); font-size:13px; margin-bottom:8px; display:block;">복용 시간대</label>
          <div class="slot-toggles">
            <input type="checkbox" id="dlg-slot-morning" value="morning" />
            <label for="dlg-slot-morning">아침</label>
            <input type="checkbox" id="dlg-slot-noon" value="noon" />
            <label for="dlg-slot-noon">점심</label>
            <input type="checkbox" id="dlg-slot-evening" value="evening" />
            <label for="dlg-slot-evening">저녁</label>
          </div>
        </div>
        <div class="field" style="margin-bottom:14px; display:flex; flex-direction:column; text-align:left;">
          <label style="font-weight:700; color:var(--clarix-navy); font-size:13px; margin-bottom:6px; display:block;">처방 일수</label>
          <input type="number" id="dlg-med-days" value="30" min="1" max="180" style="width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--clarix-line); border-radius: 10px; font-size: 14px; background:#fff; color:var(--clarix-navy);" />
        </div>
        <div class="field" style="margin-bottom:18px; display:flex; flex-direction:column; text-align:left;">
          <label style="font-weight:700; color:var(--clarix-navy); font-size:13px; margin-bottom:6px; display:block;">약 보관 위치</label>
          <input type="text" id="dlg-med-storage" placeholder="📍 예: 침실 협탁, 부엌 서랍" style="width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--clarix-line); border-radius: 10px; font-size: 14px; background:#fff; color:var(--clarix-navy);" />
        </div>
      </div>
      <div class="med-modal-footer" style="display:flex; gap:8px;">
        <button type="button" class="btn-clarix btn-clarix-ghost" id="cancel-modal-btn" style="flex:1; height:44px; font-size:14px; border-radius:22px;">취소</button>
        <button type="button" class="btn-clarix btn-clarix-primary" id="add-med-submit-btn" style="flex:2; height:44px; font-size:14px; border-radius:22px;">목록에 추가</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const modal = document.getElementById('med-modal');
      const openBtn = document.getElementById('open-add-dialog-btn');
      const closeBtn = document.getElementById('close-modal-btn');
      const cancelBtn = document.getElementById('cancel-modal-btn');
      const addSubmitBtn = document.getElementById('add-med-submit-btn');

      const addedMedsList = document.getElementById('added-meds-list');
      const emptyNotice = document.getElementById('meds-empty-notice');

      let tempMeds = [];

      function showModal() {
        if (tempMeds.length >= 5) {
          alert('새 약은 최대 5개까지만 추가할 수 있습니다.');
          return;
        }
        document.getElementById('dlg-med-name').value = '';
        document.getElementById('dlg-slot-morning').checked = false;
        document.getElementById('dlg-slot-noon').checked = false;
        document.getElementById('dlg-slot-evening').checked = false;
        document.getElementById('dlg-med-days').value = '30';
        document.getElementById('dlg-med-storage').value = '';
        
        modal.style.display = 'flex';
      }

      function hideModal() {
        modal.style.display = 'none';
      }

      openBtn.addEventListener('click', showModal);
      closeBtn.addEventListener('click', hideModal);
      cancelBtn.addEventListener('click', hideModal);

      addSubmitBtn.addEventListener('click', () => {
        const name = document.getElementById('dlg-med-name').value.trim();
        const days = document.getElementById('dlg-med-days').value;
        const storage = document.getElementById('dlg-med-storage').value.trim();
        
        const slots = [];
        if (document.getElementById('dlg-slot-morning').checked) slots.push('morning');
        if (document.getElementById('dlg-slot-noon').checked) slots.push('noon');
        if (document.getElementById('dlg-slot-evening').checked) slots.push('evening');

        if (!name) {
          alert('약 이름을 입력해 주세요.');
          return;
        }
        if (slots.length === 0) {
          alert('최소 한 개 이상의 복용 시간대를 선택해 주세요.');
          return;
        }

        tempMeds.push({ name, slots, days, storage });
        renderList();
        syncHiddenInputs();
        hideModal();
      });

      function deleteTempMed(index) {
        tempMeds.splice(index, 1);
        renderList();
        syncHiddenInputs();
      }

      function renderList() {
        const items = addedMedsList.querySelectorAll('.added-med-item');
        items.forEach(el => el.remove());

        if (tempMeds.length === 0) {
          emptyNotice.style.display = 'block';
          return;
        }
        emptyNotice.style.display = 'none';

        tempMeds.forEach((m, idx) => {
          const slotLabels = m.slots.map(s => s === 'morning' ? '아침' : (s === 'noon' ? '점심' : '저녁')).join(', ');
          const row = document.createElement('div');
          row.className = 'added-med-item';
          
          let storageHtml = '';
          if (m.storage) {
            storageHtml = '<span>· 📍 ' + escapeHtml(m.storage) + '</span>';
          }

          row.innerHTML = 
            '<div class="info-side">' +
              '<span class="med-title">' + escapeHtml(m.name) + '</span>' +
              '<div class="med-tags">' +
                '<span>' + slotLabels + '</span>' +
                '<span>· ' + m.days + '일분</span>' +
                storageHtml +
              '</div>' +
            '</div>' +
            '<button type="button" class="delete-btn">삭제</button>';
          
          row.querySelector('.delete-btn').addEventListener('click', () => {
            deleteTempMed(idx);
          });
          addedMedsList.appendChild(row);
        });
      }

      function syncHiddenInputs() {
        for (let i = 1; i <= 5; i++) {
          document.getElementById('raw-name-' + i).value = '';
          document.getElementById('raw-days-' + i).value = '';
          document.getElementById('raw-storage-' + i).value = '';
          document.getElementById('raw-slots-container-' + i).innerHTML = '';
        }

        tempMeds.forEach((m, idx) => {
          const num = idx + 1;
          document.getElementById('raw-name-' + num).value = m.name;
          document.getElementById('raw-days-' + num).value = m.days;
          document.getElementById('raw-storage-' + num).value = m.storage;

          const slotContainer = document.getElementById('raw-slots-container-' + num);
          m.slots.forEach(slot => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'slots' + num;
            input.value = slot;
            slotContainer.appendChild(input);
          });
        });
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        })[ch]);
      }
    })();
  </script>
  </div>
</body>
</html>
