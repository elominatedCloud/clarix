<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 처방전 발행</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clarix-doctor-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
  <script defer th:src="@{/js/doctor-theme.js}"></script>
  <style>
    .rx-table-card {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 18px;
      margin-top: 16px;
    }
    .rx-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .rx-row:last-child { border-bottom: 0; }
    .rx-row .who strong { display: block; font-size: 14px; font-weight: 800; color: #0F172A; }
    .rx-row .who small { font-size: 11px; color: #64748B; font-family: var(--font-mono, monospace); }
    .rx-row .med { font-size: 13px; font-weight: 700; color: #0F172A; }
    .rx-row .slot-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .rx-row .slot-tags span {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 999px; background: #EEF2FF; color: #4D63F6;
    }
    .rx-row .when { font-size: 11px; color: #64748B; font-variant-numeric: tabular-nums; }
    .rx-row .actions a {
      display: inline-flex; align-items: center;
      padding: 7px 14px; border-radius: 8px;
      background: #4D63F6; color: #fff;
      font-size: 12px; font-weight: 700; text-decoration: none;
    }
    .rx-row .actions a:hover { background: #3C50DC; }
    .empty {
      padding: 32px; text-align: center; color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body class="doctor doctor-reference">
  <div class="doctor-shell">
    <aside class="sidebar" aria-label="데스크 메뉴">
      <a class="sidebar-logo" th:href="@{/reception/}" aria-label="Clarix 홈">
        <span class="sidebar-logo-mark" aria-hidden="true"></span>
        <span class="sr-only">Clarix</span>
      </a>
      <nav class="rail-nav" aria-label="주요 메뉴">
        <a class="rail-link" th:href="@{/reception/}" title="예약 도움" aria-label="예약 도움">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          <span>예약 도움</span>
        </a>
        <a class="rail-link" th:href="@{/reception/prescriptions}" data-active="true" title="처방전 발행" aria-label="처방전 발행">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
          <span>처방전 발행</span>
        </a>
      </nav>
      <div class="rail-tools">
        <form th:action="@{/auth/logout}" method="post" class="rail-hide-narrow" style="display:inline-flex;">
          <button type="submit" class="header-icon-btn" title="로그아웃" aria-label="로그아웃">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </form>
        <button type="button" class="header-icon-btn theme-icon-btn rail-hide-narrow" data-theme-icon-btn
                title="라이트/다크 전환" aria-label="라이트 다크 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        </button>
        <span class="doctor-chip rail-hide-narrow"
              th:title="${me.name} + ' · ' + ${me.role.label()}">
          <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">최</span>
          <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">최 데스크</span>
        </span>
        <details class="doctor-chip-menu rail-show-narrow">
          <summary class="doctor-chip">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">최</span>
            <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">최 데스크</span>
          </summary>
          <div class="doctor-chip-panel">
            <button type="button" data-theme-icon-btn>
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
              <span>라이트/다크 전환</span>
            </button>
            <form th:action="@{/auth/logout}" method="post">
              <button type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                로그아웃
              </button>
            </form>
          </div>
        </details>
      </div>
    </aside>

    <main class="doctor-main">
      <div class="content doctor-index-content">
        <header class="page-title-block">
          <h1 class="page-title">처방전 발행</h1>
          <p class="page-subtitle">소속 병원의 활성 처방 목록. 우측 <strong>출력</strong> 버튼으로 PDF 저장/인쇄</p>
        </header>

        <div class="rx-table-card">
          <div th:if="${#lists.isEmpty(prescriptions)}" class="empty">
            현재 활성 처방이 없습니다.
          </div>
          <div th:each="p : ${prescriptions}" class="rx-row">
            <div class="who">
              <strong th:text="${p.patient.name}">환자</strong>
              <small th:text="'#PAT-' + ${#strings.toUpperCase(#strings.substring(p.patient.id.toString(),0,5))}">#PAT-XXXXX</small>
            </div>
            <div>
              <div class="med" th:text="${p.medicationName}">아빌리파이</div>
              <div class="slot-tags">
                <th:block th:each="s : ${p.scheduleSlots()}">
                  <span th:text="${s == 'morning'} ? '아침' : (${s == 'noon'} ? '점심' : '저녁')">아침</span>
                </th:block>
                <span style="background:#F1F5F9; color:#64748B;"
                      th:text="${p.daysSupply} + '일분'">30일분</span>
              </div>
            </div>
            <div class="when">
              발행 <span th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}">2026.04.29</span><br/>
              종료 <span th:text="${#temporals.format(p.endDate(), 'yyyy.MM.dd')}">2026.05.29</span>
            </div>
            <div class="actions">
              <a th:href="@{'/reception/patient/' + ${p.patient.id} + '/prescription-print'}"
                 target="_blank">출력 / PDF</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
