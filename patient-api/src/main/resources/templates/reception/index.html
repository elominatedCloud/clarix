<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 데스크</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clarix-doctor-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
  <script defer th:src="@{/js/doctor-theme.js}"></script>
  <style>
    .reception-row td { vertical-align: top; padding-top: 10px; padding-bottom: 10px; }
    .reception-row textarea {
      width: 100%; min-height: 36px; padding: 6px 8px;
      border: 1px solid var(--border-subtle); border-radius: 4px;
      font-family: inherit; font-size: 12px; resize: vertical;
    }
    .reception-row form.memo-form { display: flex; gap: 6px; align-items: flex-start; }
    .reception-row form.memo-form button {
      height: 28px; padding: 0 10px; font-size: 11px; align-self: flex-start;
    }
    .reception-row .refill-cell { font-variant-numeric: tabular-nums; }
    .reception-row .refill-cell strong {
      display: block; font-size: 16px; font-weight: 700; line-height: 1.1;
    }
    .reception-row .refill-cell .end {
      font-size: 11px; color: var(--text-muted);
    }
    .book-cell {
      display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    }
    .appointment-form {
      display: flex; gap: 6px; align-items: center; flex-wrap: nowrap;
    }
    .appointment-form input[type="datetime-local"] {
      height: 28px; min-width: 150px; padding: 0 8px;
      border: 1px solid var(--border-subtle); border-radius: 4px;
      font: inherit; font-size: 11px; color: var(--text-main);
    }
    .book-cell .booked-when {
      font-size: 11px; color: #027A48; font-variant-numeric: tabular-nums;
    }
    .book-cell button {
      height: 28px; padding: 0 12px;
      border-radius: 4px; border: 1px solid var(--border-subtle);
      background: #fff; cursor: pointer; font-size: 11px; font-weight: 600;
    }
    .book-cell button.book {
      background: #5E6AD2; color: #fff; border-color: #5E6AD2;
    }
    .book-cell button.cancel {
      background: #FEF2F2; color: #B42318; border-color: #FECACA;
    }
    .request-panel {
      margin: 0 0 16px; padding: 14px;
      border: 1px solid var(--border-subtle); border-radius: 8px;
      background: var(--doctor-surface);
    }
    .request-panel h3 {
      margin: 0 0 10px; font-size: 13px; font-weight: 700;
    }
    .request-list {
      display: grid; gap: 8px;
    }
    .request-item {
      display: grid; grid-template-columns: 120px 1fr auto;
      gap: 10px; align-items: center;
      padding: 10px 12px; border: 1px solid var(--border-subtle);
      border-radius: 6px; background: var(--doctor-surface-muted);
    }
    .request-item .meta {
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
    }
    .request-item .name { font-weight: 700; }
    .request-item .time { color: var(--text-muted); font-size: 11px; }
    .request-item .reason {
      color: var(--text-primary); font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .request-empty { color: var(--text-muted); font-size: 12px; }
    .schedule-form {
      display: flex; gap: 6px; align-items: center;
    }
    .schedule-form input[type="datetime-local"] {
      height: 28px; min-width: 160px; padding: 0 8px;
      border: 1px solid var(--border-subtle); border-radius: 4px;
      font: inherit; font-size: 11px; color: var(--text-main);
    }
  </style>
</head>
<body class="doctor doctor-reference">
  <div class="doctor-shell">
    <aside class="sidebar" aria-label="데스크 메뉴">
      <a class="sidebar-logo" th:href="@{/reception/}" aria-label="Clarix 홈">
        <span class="sidebar-logo-mark" aria-hidden="true"></span>
        <span class="sr-only">Clarix</span>
      </a>
      <nav class="rail-nav" aria-label="주요 메뉴">
        <a class="rail-link" th:href="@{/reception/}" data-active="true" title="예약 도움" aria-label="예약 도움">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          <span>예약 도움</span>
        </a>
        <a class="rail-link" th:href="@{/reception/prescriptions}" title="처방전 발행" aria-label="처방전 발행">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
          <span>처방전 발행</span>
        </a>
      </nav>
      <div class="rail-tools">
        <form th:action="@{/auth/logout}" method="post" class="rail-hide-narrow" style="display:inline-flex;">
          <button type="submit" class="header-icon-btn" title="로그아웃" aria-label="로그아웃">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </form>
        <button type="button" class="header-icon-btn theme-icon-btn rail-hide-narrow" data-theme-icon-btn
                title="라이트/다크 전환" aria-label="라이트 다크 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        </button>
        <span class="doctor-chip rail-hide-narrow"
              th:title="${me.name} + ' · ' + ${me.role.label()}">
          <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">최</span>
          <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">최 데스크</span>
        </span>
        <details class="doctor-chip-menu rail-show-narrow">
          <summary class="doctor-chip">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">최</span>
            <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">최 데스크</span>
          </summary>
          <div class="doctor-chip-panel">
            <button type="button" data-theme-icon-btn>
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
              <span>라이트/다크 전환</span>
            </button>
            <form th:action="@{/auth/logout}" method="post">
              <button type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                로그아웃
              </button>
            </form>
          </div>
        </details>
      </div>
    </aside>

    <main class="doctor-main">
      <div class="content doctor-index-content">
        <header class="page-title-block">
          <h1 class="page-title">예약 도움</h1>
          <p class="page-subtitle">처방 종료 임박 환자 우선 · 미예약 환자 위쪽</p>
        </header>

        <div th:if="${formError}" class="doctor-alert warn" style="margin-bottom:16px;">
          <span class="badge">입력 확인</span>
          <span th:text="${formError}">입력값을 확인하세요</span>
        </div>

        <section class="request-panel" aria-label="환자 진료 요청">
          <h3>환자 진료 요청</h3>
          <div th:if="${#lists.isEmpty(pendingCareRequests)}" class="request-empty">
            접수 대기 중인 진료 요청이 없습니다.
          </div>
          <div th:unless="${#lists.isEmpty(pendingCareRequests)}" class="request-list">
            <article th:each="req : ${pendingCareRequests}" class="request-item">
              <div class="meta">
                <span class="name" th:text="${req.patient.name}">환자명</span>
                <span class="time" th:text="${req.createdAtDisplay()}">5월 27일 14:00</span>
              </div>
              <div class="reason" th:text="${req.reason}">진료 요청 내용</div>
              <form th:action="@{'/reception/request/' + ${req.id} + '/scheduled'}"
                    method="post" class="schedule-form">
                <input type="hidden" name="booked" value="true" />
                <input type="datetime-local" name="appointmentAt" required
                       aria-label="진료 예약 일시" />
                <button type="submit" class="btn btn-secondary">처리 완료</button>
              </form>
            </article>
          </div>
        </section>

        <table class="dense-table">
          <thead>
            <tr>
              <th style="width:80px">상태</th>
              <th>환자명</th>
              <th style="width:130px">남은 처방</th>
              <th>메모</th>
              <th style="width:260px">진료 일정</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(rows)}">
              <td colspan="5" style="text-align:center; padding:32px; color:var(--text-muted)">
                같은 병원에 등록된 환자가 없습니다.
              </td>
            </tr>
            <tr th:each="r : ${rows}" class="reception-row">
              <td>
                <span class="status-pill" th:attr="data-tone=${r.urgencyTone()}"
                      th:text="${r.urgencyLabel()}">·</span>
              </td>
              <td class="col-name" th:text="${r.name}">·</td>
              <td class="refill-cell">
                <th:block th:if="${r.daysToRefill >= 0}">
                  <strong th:text="${r.daysToRefill} + '일'">—</strong>
                  <span class="end" th:if="${r.nextRefillDate != null}"
                        th:text="'종료 ' + ${#temporals.format(r.nextRefillDate, 'M/d')}">—</span>
                </th:block>
                <th:block th:unless="${r.daysToRefill >= 0}">
                  <span style="color:var(--text-tertiary)">—</span>
                </th:block>
              </td>
              <td>
                <form class="memo-form" th:action="@{'/reception/patient/' + ${r.id} + '/memo'}" method="post">
                  <textarea name="memo" placeholder="연락 메모 (예: 4/30 14시 통화 예약)" th:text="${r.memo}"></textarea>
                  <button type="submit" class="btn btn-secondary">저장</button>
                </form>
              </td>
              <td class="book-cell">
                <th:block th:if="${r.bookedAt != null}">
                  <span class="booked-when"
                        th:text="${r.bookedAtDisplayValue()} + ' 진료 예정'">—</span>
                  <form th:action="@{'/reception/patient/' + ${r.id} + '/book'}" method="post">
                    <input type="hidden" name="booked" value="false" />
                    <button type="submit" class="cancel">예약 취소</button>
                  </form>
                </th:block>
                <form th:unless="${r.bookedAt != null}" class="appointment-form"
                      th:action="@{'/reception/patient/' + ${r.id} + '/book'}" method="post">
                  <input type="hidden" name="booked" value="true" />
                  <input type="datetime-local" name="appointmentAt" required />
                  <button type="submit" class="book">확정</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
