<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
</head>
<body class="patient clarix auth-page" th:classappend="${role == 'doctor'} ? ' auth-doctor' : ' auth-patient'">
  <div class="patient-shell">
    <div class="auth-card mobile-auth-card">
      <a class="mobile-back" th:href="@{/}" aria-label="이전 화면">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 th:text="${role == 'doctor'} ? 'Welcome to Clarix.' : 'Sign in Clarix.'">Sign in Clarix.</h1>
      <p class="subtitle">서비스의 원활한 사용을 위해<br/>로그인 부탁드려요.</p>
      <p th:if="${error}" th:text="${error}" class="auth-error"></p>
      <p th:if="${notice}" th:text="${notice}" class="auth-notice"></p>
      <form th:action="@{/auth/login}" method="post" novalidate>
        <input type="hidden" name="role" th:value="${role}" />
        <div class="field">
          <label for="email">아이디</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="아이디 입력" required />
        </div>
        <div class="field password-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required minlength="6" />
          <button type="button" class="password-toggle-btn" aria-label="비밀번호 보이기/숨기기" onclick="togglePasswordVisibility('password', this)">
            <svg id="eye-icon" viewBox="0 0 24 24">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-clarix btn-clarix-primary">로그인</button>
      </form>
      <div class="auth-footer mobile-auth-footer">
        계정이 없으신가요?
        <a th:href="@{/auth/signup(role=${role})}">회원가입</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const svg = btn.querySelector('svg');
      if (!input || !svg) return;
      
      if (input.type === 'password') {
        input.type = 'text';
        svg.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      } else {
        input.type = 'password';
        svg.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      }
    }
  </script>
</body>
</html>
