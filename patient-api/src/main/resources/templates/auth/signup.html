<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 회원가입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
</head>
<body class="patient clarix auth-page" th:classappend="${role == 'doctor'} ? ' auth-doctor' : ' auth-patient'">
  <div class="patient-shell">
    <div class="auth-card mobile-auth-card mobile-signup-card">
      <a class="mobile-back" th:href="@{/auth/login(role=${role})}" aria-label="이전 화면">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 th:text="${role == 'doctor'} ? 'Welcome Clinician.' : 'Welcome to Clarix.'">Welcome to Clarix.</h1>
      <p class="subtitle">서비스의 원활한 사용을 위해<br/>계정을 만들어주세요.</p>
      <p th:if="${error}" th:text="${error}" class="auth-error"></p>
      <form th:action="@{/auth/signup}" method="post" novalidate>
        <input type="hidden" name="role" th:value="${role}" />
        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" th:value="${name}" placeholder="이름 입력" required />
        </div>
        <div class="field">
          <label for="email">아이디</label>
          <input type="email" id="email" name="email" th:value="${email}" autocomplete="email" placeholder="아이디 입력" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="비밀번호 입력" required minlength="6" />
        </div>
        <button type="submit" class="btn-clarix btn-clarix-primary">계정 생성</button>
      </form>
      <div class="auth-footer mobile-auth-footer">
        이미 계정이 있으신가요? <a th:href="@{/auth/login(role=${role})}">로그인</a>
      </div>
      <p class="auth-note">
        간호사·의료기사·데스크 직원은 의사가 초대한 이메일로 가입하면<br/>
        역할과 병원이 자동 적용됩니다.
      </p>
    </div>
  </div>
</body>
</html>
