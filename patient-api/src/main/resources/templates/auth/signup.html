<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 회원가입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
</head>
<body class="patient clarix auth-page">
  <div class="patient-shell">
    <div class="auth-card">
      <h1>회원가입</h1>
      <p class="subtitle">5초면 충분합니다.</p>
      <p th:if="${error}" th:text="${error}" class="auth-error"></p>
      <form th:action="@{/auth/signup}" method="post" novalidate>
        <div class="field">
          <label>역할 선택</label>
          <div class="role-pick">
            <input type="radio" name="role" id="role-patient" value="patient" th:checked="${role != 'doctor'}" />
            <label for="role-patient">환자</label>
            <input type="radio" name="role" id="role-doctor" value="doctor" th:checked="${role == 'doctor'}" />
            <label for="role-doctor">의료진</label>
          </div>
        </div>
        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" th:value="${name}" required />
        </div>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" th:value="${email}" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">비밀번호 (최소 6자)</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" />
        </div>
        <button type="submit" class="btn-clarix btn-clarix-primary">계정 생성</button>
      </form>
      <div class="auth-footer">
        이미 계정이 있으신가요? <a th:href="@{/auth/login}">로그인</a>
      </div>
      <p style="font-size:11px; color:var(--clarix-coral-dim); text-align:center; margin:14px 0 0; line-height:1.5;">
        간호사·의료기사·데스크 직원은 의사가 초대한 이메일로 가입하면<br/>
        역할과 병원이 자동 적용됩니다.
      </p>
    </div>
  </div>
</body>
</html>
