<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clarix · 접근 권한 없음</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/patient.css}" />
</head>
<body class="patient clarix auth-page">
  <div class="patient-shell">
    <main class="auth-card mobile-auth-card access-denied-card" aria-labelledby="error-title">
      <a class="mobile-back" th:href="@{/}" aria-label="홈으로 이동">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <p class="access-eyebrow">403</p>
      <h1 id="error-title">접근 권한이 없습니다.</h1>
      <p class="subtitle">
        현재 로그인한 계정으로는 이 화면을 열 수 없습니다.<br/>
        필요한 역할의 계정으로 다시 로그인하세요.
      </p>
      <div class="access-actions">
        <a class="btn-clarix btn-clarix-primary" th:href="@{/}">홈으로 이동</a>
      </div>
    </main>
  </div>
</body>
</html>
