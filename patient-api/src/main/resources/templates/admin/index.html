<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
</head>
<body class="doctor">
  <div class="doctor-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">Clarix · Admin</div>
      <div class="sidebar-section">B2B</div>
      <a class="sidebar-item" data-active="true" th:href="@{/admin/}">병원 관리</a>
      <a class="sidebar-item" th:href="@{/admin/users}">사용자 관리</a>
      <div class="sidebar-section">Account</div>
      <div class="sidebar-item sidebar-uid" style="font-size:11px; color:var(--text-muted)" th:text="${me.name} + ' · ADMIN'">·</div>
      <form th:action="@{/auth/logout}" method="post" class="sidebar-logout">
        <button class="sidebar-item" style="border:0; background:transparent; width:100%; text-align:left; cursor:pointer">로그아웃</button>
      </form>
    </aside>

    <main class="doctor-main">
      <div class="topbar">
        <div class="breadcrumb"><span>Admin</span><span class="sep">/</span><span class="current">병원 관리</span></div>
        <div class="topbar-right">
          <span class="avatar" style="background:#0F172A" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">A</span>
        </div>
      </div>

      <div class="content">
        <div th:if="${formError}" class="doctor-alert warn" style="margin-bottom:16px;">
          <span class="badge">입력 확인</span>
          <span th:text="${formError}">입력값을 확인하세요</span>
        </div>

        <!-- KPI -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <span class="kpi-label">전체 병원</span>
            <span class="kpi-value" th:text="${totalH}">0</span>
            <span class="kpi-sub" th:text="${partnered} + '곳 활성'">—</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">의사</span>
            <span class="kpi-value" th:text="${totalDoc}">0</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">직원</span>
            <span class="kpi-value" th:text="${totalStaff}">0</span>
            <span class="kpi-sub">간호사·의료기사·데스크</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">환자</span>
            <span class="kpi-value" th:text="${totalPatient}">0</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">활성 비율</span>
            <span class="kpi-value"
                  th:text="${totalH == 0 ? '—' : (partnered * 100 / totalH) + '%'}">—</span>
          </div>
        </div>

        <!-- 새 병원 등록 -->
        <h2 style="margin:0 0 8px;">새 병원 등록</h2>
        <form th:action="@{/admin/hospital}" method="post"
              style="display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; margin-bottom:24px;">
          <input type="text" name="name" placeholder="병원명" required
                 style="flex:2; min-width:200px; height:32px; padding:0 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:13px;" />
          <input type="text" name="specialty" placeholder="진료과 (예: 정신건강의학과)" required
                 style="flex:1; min-width:160px; height:32px; padding:0 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:13px;" />
          <input type="text" name="address" placeholder="주소" required
                 style="flex:2; min-width:200px; height:32px; padding:0 12px; border:1px solid var(--border-subtle); border-radius:6px; font-size:13px;" />
          <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted);">
            <input type="checkbox" name="partnered" value="true" checked /> 활성
          </label>
          <button type="submit" class="btn btn-primary" style="height:32px;">등록</button>
        </form>

        <!-- 병원 리스트 -->
        <h2 style="margin:0 0 8px;">병원 목록</h2>
        <table class="dense-table">
          <thead>
            <tr>
              <th style="width:80px">상태</th>
              <th>이름</th>
              <th style="width:140px">진료과</th>
              <th>주소</th>
              <th style="width:60px">의사</th>
              <th style="width:60px">직원</th>
              <th style="width:60px">환자</th>
              <th style="width:90px"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(rows)}">
              <td colspan="8" style="text-align:center; padding:24px; color:var(--text-muted)">
                등록된 병원이 없습니다.
              </td>
            </tr>
            <tr th:each="r : ${rows}">
              <td>
                <span class="status-pill" th:attr="data-tone=${r.partnered ? 'ok' : 'muted'}"
                      th:text="${r.partnered ? '활성' : '비활성'}">·</span>
              </td>
              <td class="col-name" th:text="${r.name}">·</td>
              <td class="col-num" th:text="${r.specialty}">·</td>
              <td th:text="${r.address}">·</td>
              <td class="col-num" th:text="${r.doctorCount}">0</td>
              <td class="col-num" th:text="${r.staffCount}">0</td>
              <td class="col-num" th:text="${r.patientCount}">0</td>
              <td>
                <form th:action="@{'/admin/hospital/' + ${r.id} + '/toggle'}" method="post">
                  <input type="hidden" name="partnered" th:value="${!r.partnered}" />
                  <button type="submit" class="btn btn-ghost"
                          style="height:24px; padding:0 8px; font-size:12px;"
                          th:text="${r.partnered ? '비활성' : '활성'}">·</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
