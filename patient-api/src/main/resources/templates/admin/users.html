<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 사용자 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
</head>
<body class="doctor">
  <div class="doctor-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">Clarix · Admin</div>
      <div class="sidebar-section">B2B</div>
      <a class="sidebar-item" th:href="@{/admin/}">병원 관리</a>
      <a class="sidebar-item" data-active="true" th:href="@{/admin/users}">사용자 관리</a>
      <div class="sidebar-section">Account</div>
      <div class="sidebar-item sidebar-uid" style="font-size:11px; color:var(--text-muted)" th:text="${me.name} + ' · ADMIN'">·</div>
      <form th:action="@{/auth/logout}" method="post" class="sidebar-logout">
        <button class="sidebar-item" style="border:0; background:transparent; width:100%; text-align:left; cursor:pointer">로그아웃</button>
      </form>
    </aside>

    <main class="doctor-main">
      <div class="topbar">
        <div class="breadcrumb"><span>Admin</span><span class="sep">/</span><span class="current">사용자 관리</span></div>
        <div class="topbar-right">
          <span class="avatar" style="background:#0F172A" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">A</span>
        </div>
      </div>

      <div class="content">
        <div th:if="${formError}" class="doctor-alert warn" style="margin-bottom:16px;">
          <span class="badge">입력 확인</span>
          <span th:text="${formError}">입력값을 확인하세요</span>
        </div>

        <h2 style="margin:0 0 8px;">사용자 목록 · 역할 / 병원 변경</h2>
        <p style="font-size:12px; color:var(--text-muted); margin:0 0 12px;">
          역할 또는 소속 병원을 바꾸면 즉시 적용됩니다. 환자 → 의사 변환 등 직접적인 권한 이동에 주의.
        </p>

        <table class="dense-table">
          <thead>
            <tr>
              <th>이름</th>
              <th>이메일</th>
              <th style="width:140px">역할</th>
              <th style="width:240px">병원</th>
              <th style="width:120px">가입일</th>
              <th style="width:80px"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}">
              <form th:action="@{'/admin/users/' + ${u.id}}" method="post" style="display:contents;">
                <td class="col-name" th:text="${u.name}">·</td>
                <td class="col-num" th:text="${u.email}">·</td>
                <td>
                  <select name="role" style="width:100%; height:28px; font-size:12px; border:1px solid var(--border-subtle); border-radius:4px;">
                    <option th:each="r : ${roles}" th:value="${r.name()}"
                            th:selected="${u.role.name() == r.name()}"
                            th:text="${r.label()}">·</option>
                  </select>
                </td>
                <td>
                  <select name="hospitalId" style="width:100%; height:28px; font-size:12px; border:1px solid var(--border-subtle); border-radius:4px;">
                    <option value="">(미설정)</option>
                    <option th:each="h : ${hospitals}" th:value="${h.id}"
                            th:selected="${u.hospital != null and u.hospital.id == h.id}"
                            th:text="${h.name}">·</option>
                  </select>
                </td>
                <td class="col-num" th:text="${#temporals.format(u.createdAt,'yyyy-MM-dd')}">·</td>
                <td>
                  <button type="submit" class="btn btn-secondary"
                          style="height:24px; padding:0 8px; font-size:12px;">저장</button>
                </td>
              </form>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
