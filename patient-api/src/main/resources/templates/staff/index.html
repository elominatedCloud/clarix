<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 차팅</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
</head>
<body class="doctor">
  <div class="doctor-shell">
    <aside class="sidebar">
      <div class="sidebar-brand" th:text="'Clarix · ' + ${me.role.label()}">Clarix · 직원</div>

      <div class="sidebar-section">Workspace</div>
      <a class="sidebar-item" data-active="true" th:href="@{/staff/}">차팅</a>

      <div class="sidebar-section">Account</div>
      <div class="sidebar-item sidebar-uid" style="font-size:11px; color:var(--text-muted)"
           th:text="${me.name} + ' · ' + ${me.role.label()}">·</div>
      <div class="sidebar-item sidebar-uid" style="font-size:11px; color:var(--text-muted)"
           th:text="${me.hospital != null ? me.hospital.name : '병원 미설정'}">·</div>
      <form th:action="@{/auth/logout}" method="post" class="sidebar-logout">
        <button class="sidebar-item" style="border:0; background:transparent; width:100%; text-align:left; cursor:pointer">로그아웃</button>
      </form>
    </aside>

    <main class="doctor-main">
      <div class="topbar">
        <div class="breadcrumb">
          <span>Workspace</span>
          <span class="sep">/</span>
          <span class="current">차팅</span>
        </div>
        <div class="topbar-right">
          <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">직</span>
        </div>
      </div>

      <div class="content">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <h2 style="margin:0">환자 목록</h2>
          <span style="color:var(--text-muted); font-size:12px;"
                th:text="${me.hospital != null ? me.hospital.name + ' · 행 클릭으로 차팅 시작' : '병원 미설정'}">·</span>
        </div>

        <table class="dense-table">
          <thead>
            <tr>
              <th>환자명</th>
              <th style="width:160px">최근 감정</th>
              <th style="width:140px">등록일</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(patients)}">
              <td colspan="3" style="text-align:center; padding:32px; color:var(--text-muted)">
                같은 병원에 등록된 환자가 없습니다.
              </td>
            </tr>
            <tr th:each="p : ${patients}" class="row-clickable"
                th:attr="data-href=@{'/staff/patient/' + ${p.id}}">
              <td class="col-name" th:text="${p.name}">·</td>
              <td style="color:var(--text-muted); font-size:12px;">—</td>
              <td class="col-num" th:text="${#temporals.format(p.createdAt,'yyyy-MM-dd')}">·</td>
            </tr>
          </tbody>
        </table>
      </div>

      <script>
        document.querySelectorAll('tr.row-clickable[data-href]').forEach(tr => {
          tr.addEventListener('click', (e) => {
            if (e.target.closest('a, button, form, input, label')) return;
            location.href = tr.dataset.href;
          });
        });
      </script>
    </main>
  </div>
</body>
</html>
