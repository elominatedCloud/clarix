<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 차팅</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clarix-doctor-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
  <script defer th:src="@{/js/doctor-theme.js}"></script>
</head>
<body class="doctor doctor-reference">
  <div class="doctor-shell">
    <aside class="sidebar" aria-label="직원 메뉴">
      <a class="sidebar-logo" th:href="@{/staff/}" aria-label="Clarix 홈">
        <span class="sidebar-logo-mark" aria-hidden="true"></span>
        <span class="sr-only">Clarix</span>
      </a>
      <nav class="rail-nav" aria-label="주요 메뉴">
        <a class="rail-link" th:href="@{/staff/}" data-active="true" title="차팅" aria-label="차팅">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6"/><path d="M4 19h16"/><path d="M8 16V10"/><path d="M12 16V8"/><path d="M16 16v-4"/></svg>
          <span>차팅</span>
        </a>
      </nav>
      <div class="rail-tools">
        <form th:action="@{/auth/logout}" method="post" class="rail-hide-narrow" style="display:inline-flex;">
          <button type="submit" class="header-icon-btn" title="로그아웃" aria-label="로그아웃">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </form>
        <button type="button" class="header-icon-btn theme-icon-btn rail-hide-narrow" data-theme-icon-btn
                title="라이트/다크 전환" aria-label="라이트 다크 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        </button>
        <span class="doctor-chip rail-hide-narrow"
              th:title="${me.name} + ' · ' + ${me.role.label()}">
          <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">직</span>
          <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">박 기사</span>
        </span>
        <details class="doctor-chip-menu rail-show-narrow">
          <summary class="doctor-chip">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">직</span>
            <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">박 기사</span>
          </summary>
          <div class="doctor-chip-panel">
            <button type="button" data-theme-icon-btn>
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
              <span>라이트/다크 전환</span>
            </button>
            <form th:action="@{/auth/logout}" method="post">
              <button type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                로그아웃
              </button>
            </form>
          </div>
        </details>
      </div>
    </aside>

    <main class="doctor-main">
      <div class="content doctor-index-content">
        <header class="page-title-block">
          <h1 class="page-title">환자 목록</h1>
          <p class="page-subtitle"
             th:text="${me.hospital != null ? me.hospital.name + ' · 행 클릭으로 차팅 시작' : '병원 미설정'}">·</p>
        </header>

        <table class="dense-table">
          <thead>
            <tr>
              <th>환자명</th>
              <th style="width:160px">최근 감정</th>
              <th style="width:140px">등록일</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(patients)}">
              <td colspan="3" style="text-align:center; padding:32px; color:var(--text-muted)">
                같은 병원에 등록된 환자가 없습니다.
              </td>
            </tr>
            <tr th:each="p : ${patients}" class="row-clickable"
                th:attr="data-href=@{'/staff/patient/' + ${p.id}}">
              <td class="col-name" th:text="${p.name}">·</td>
              <td style="color:var(--text-muted); font-size:12px;">—</td>
              <td class="col-num" th:text="${#temporals.format(p.createdAt,'yyyy-MM-dd')}">·</td>
            </tr>
          </tbody>
        </table>
      </div>

      <script>
        document.querySelectorAll('tr.row-clickable[data-href]').forEach(tr => {
          tr.addEventListener('click', (e) => {
            if (e.target.closest('a, button, form, input, label')) return;
            location.href = tr.dataset.href;
          });
        });
      </script>
    </main>
  </div>
</body>
</html>
