<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarix · 차팅</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clarix-doctor-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.css" />
  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/doctor.css}" />
  <script defer th:src="@{/js/doctor-theme.js}"></script>
</head>
<body class="doctor doctor-reference">
  <div class="doctor-shell">
    <aside class="sidebar" aria-label="직원 메뉴">
      <a class="sidebar-logo" th:href="@{/staff/}" aria-label="Clarix 홈">
        <span class="sidebar-logo-mark" aria-hidden="true"></span>
        <span class="sr-only">Clarix</span>
      </a>
      <nav class="rail-nav" aria-label="주요 메뉴">
        <a class="rail-link" th:href="@{/staff/}" data-active="true" title="차팅" aria-label="차팅">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6"/><path d="M4 19h16"/><path d="M8 16V10"/><path d="M12 16V8"/><path d="M16 16v-4"/></svg>
          <span>차팅</span>
        </a>
      </nav>
      <div class="rail-tools">
        <form th:action="@{/auth/logout}" method="post" class="rail-hide-narrow" style="display:inline-flex;">
          <button type="submit" class="header-icon-btn" title="로그아웃" aria-label="로그아웃">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </form>
        <button type="button" class="header-icon-btn theme-icon-btn rail-hide-narrow" data-theme-icon-btn
                title="라이트/다크 전환" aria-label="라이트 다크 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        </button>
        <span class="doctor-chip rail-hide-narrow"
              th:title="${me.name} + ' · ' + ${me.role.label()}">
          <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">직</span>
          <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">박 기사</span>
        </span>
        <details class="doctor-chip-menu rail-show-narrow">
          <summary class="doctor-chip">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.name,0,1))}">직</span>
            <span class="doctor-chip-name" th:text="${me.name} + ' ' + ${me.role.label()}">박 기사</span>
          </summary>
          <div class="doctor-chip-panel">
            <button type="button" data-theme-icon-btn>
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
              <span>라이트/다크 전환</span>
            </button>
            <form th:action="@{/auth/logout}" method="post">
              <button type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                로그아웃
              </button>
            </form>
          </div>
        </details>
      </div>
    </aside>

    <main class="doctor-main">
      <div class="content doctor-index-content">
        <header class="page-title-block">
          <h1 class="page-title" th:text="${patient.name} + ' · 차팅'">환자 · 차팅</h1>
          <p class="page-subtitle">
            <a th:href="@{/staff/}" style="color:var(--text-muted);">환자 목록</a>
            <span style="color:var(--text-tertiary); margin:0 6px;">/</span>
            <span th:text="${patient.name}">환자</span>
          </p>
        </header>

        <div class="detail-grid" style="grid-template-columns: 1fr;">
        <div class="detail-pane">
          <div th:if="${formError}" class="doctor-alert warn" style="margin-bottom:16px;">
            <span class="badge">입력 확인</span>
            <span th:text="${formError}">입력값을 확인하세요</span>
          </div>

          <!-- 환자 자가보고 (read-only) -->
          <div class="charting-self-report">
            <h3 th:text="${patient.name} + '의 자가보고 (최근 14일)'">환자 자가보고</h3>

            <div th:if="${header.lastMoodEmotion() != null}"
                 style="display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border-subtle);">
              <span style="display:inline-flex; align-items:center; justify-content:center; font-size:24px;"
                    th:text="${header.lastMoodEmotion().emoji()}">😀</span>
              <div style="font-size:13px; line-height:1.5;">
                <div style="font-weight:600;"
                     th:text="${header.lastMoodEmotion().label()} + ' · ' + ${#temporals.format(header.lastMoodDate(),'M월 d일')}">—</div>
                <div style="color:var(--text-muted);"
                     th:text="${header.lastMoodJournal() != null and !#strings.isEmpty(header.lastMoodJournal())} ? ${header.lastMoodJournal()} : '일기 없음'">—</div>
              </div>
            </div>

            <ul class="tl-list" style="margin-top:10px;">
              <li th:each="e : ${timeline}" th:if="${e.kind() != 'soap'}"
                  class="tl-row" th:attr="data-kind=${e.kind()}">
                <th:block th:if="${e.kind() == 'mood' and e.emotion() != null}">
                  <span class="tl-bub"
                        th:style="'--bub: var(--grad-' + ${e.emotion().slug()} + ');'"
                        th:text="${e.emotion().emoji()}">😀</span>
                </th:block>
                <th:block th:unless="${e.kind() == 'mood' and e.emotion() != null}">
                  <span class="tl-dot-wrap"><span class="tl-dot"></span></span>
                </th:block>
                <span class="tl-when" th:text="${#temporals.format(e.when(),'MM-dd HH:mm')}">·</span>
                <span class="tl-text">
                  <th:block th:if="${e.kind() == 'mood' and e.emotion() != null}">
                    <strong th:text="${e.emotion().label()}">기쁨</strong>
                    <span th:if="${e.journal() != null and !#strings.isEmpty(e.journal())}"
                          class="tl-journal"
                          th:text="' — ' + ${#strings.abbreviate(e.journal(), 60)}">—</span>
                  </th:block>
                  <th:block th:unless="${e.kind() == 'mood' and e.emotion() != null}"
                            th:text="${e.text()}">·</th:block>
                </span>
              </li>
              <li th:if="${#lists.isEmpty(timeline)}" style="padding:12px; color:var(--text-muted); font-size:12px;">
                자가보고 기록이 없습니다.
              </li>
            </ul>
          </div>

          <!-- 새 차팅 작성 -->
          <div class="soap-card charting-soap">
            <h3 style="font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 12px;">새 차팅</h3>
            <form th:action="@{'/staff/patient/' + ${patient.id} + '/soap'}" method="post">
              <div class="soap-grid">
                <div><label>S · 주관적</label><textarea name="subjective" placeholder="환자 호소"></textarea></div>
                <div><label>O · 객관적</label><textarea name="objective" placeholder="검사·관찰"></textarea></div>
                <div><label>A · 평가</label><textarea name="assessment" placeholder="해석·판단"></textarea></div>
                <div><label>P · 계획</label><textarea name="plan" placeholder="다음 액션"></textarea></div>
              </div>
              <div class="soap-actions">
                <button type="submit" class="btn btn-primary">저장</button>
              </div>
            </form>
          </div>

          <!-- 과거 차팅 -->
          <div th:if="${!#lists.isEmpty(notes)}">
            <h3 style="font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 12px;">과거 차팅</h3>
            <div th:each="n : ${notes}" style="background:#fff; border:1px solid var(--border-subtle); border-radius:6px; padding:12px; margin-bottom:6px;">
              <div style="display:flex; gap:8px; align-items:center; font-size:12px; color:var(--text-muted)">
                <span class="status-pill"
                      th:attr="data-tone=${n.kind.name() == 'SOAP' ? 'ok' : (n.kind.name() == 'NURSING' ? 'warn' : 'muted')}"
                      style="text-transform:none; letter-spacing:0;"
                      th:text="${n.kind.label()}">SOAP</span>
                <span th:text="${#temporals.format(n.createdAt,'yyyy-MM-dd HH:mm')}">·</span>
                <span th:if="${n.updatedAt != null}" style="color:var(--text-tertiary)"
                      th:text="'(수정 ' + ${#temporals.format(n.updatedAt,'MM-dd HH:mm')} + ')'">·</span>
                <span th:text="'· ' + ${n.doctor.name} + ' (' + ${n.doctor.role.label()} + ')'">·</span>
                <span th:if="${n.doctor.id == me.id}"
                      style="margin-left:auto; display:flex; align-items:center; gap:8px;">
                  <a th:href="@{'/staff/note/' + ${n.id} + '/edit'}"
                     style="color:#5E6AD2; font-weight:600;">수정</a>
                  <form th:action="@{'/staff/note/' + ${n.id} + '/delete'}" method="post"
                        onsubmit="return confirm('이 차팅을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다.');"
                        style="display:inline;">
                    <button type="submit"
                            style="border:0; background:transparent; color:#B42318; font-weight:600; cursor:pointer; padding:0;">삭제</button>
                  </form>
                </span>
              </div>
              <div th:if="${n.subjective != null and !#strings.isEmpty(n.subjective)}"
                   style="font-size:13px; margin-top:6px;"><b>S</b> <span th:text="${n.subjective}">·</span></div>
              <div th:if="${n.objective != null and !#strings.isEmpty(n.objective)}"
                   style="font-size:13px;"><b>O</b> <span th:text="${n.objective}">·</span></div>
              <div th:if="${n.assessment != null and !#strings.isEmpty(n.assessment)}"
                   style="font-size:13px;"><b>A</b> <span th:text="${n.assessment}">·</span></div>
              <div th:if="${n.plan != null and !#strings.isEmpty(n.plan)}"
                   style="font-size:13px;"><b>P</b> <span th:text="${n.plan}">·</span></div>
            </div>
          </div>

        </div>
      </div>
      </div>
    </main>
  </div>
</body>
</html>
