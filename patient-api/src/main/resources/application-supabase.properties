# 활성화: ./gradlew bootRun --args='--spring.profiles.active=supabase'
# 또는 IntelliJ Run Config의 VM options에 -Dspring.profiles.active=supabase
#
# Supabase Settings > Database > Connection string 받아서 환경변수로 주입.
# psql 형식: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# JDBC 형식으로 변환:
#   spring.datasource.url=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
#   spring.datasource.username=postgres.<ref>
#   spring.datasource.password=<DB_PASSWORD>

spring.datasource.url=${SUPABASE_JDBC_URL:}
spring.datasource.username=${SUPABASE_JDBC_USER:}
spring.datasource.password=${SUPABASE_JDBC_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 우리가 만든 스키마/마이그레이션이 이미 있으니 validate (DDL 자동생성 X)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Supabase 모드에서는 H2 콘솔/시드 끔
spring.h2.console.enabled=false
spring.sql.init.mode=never
